name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # GitHub-hosted CI can't make a registration token without a stored
      # personal access token, so this checks everything short of
      # registering: the tarball, the runner starting as its own user with
      # its libraries in place, and the unit.
      - name: Check the runner is installed, runs as its user and has its unit
        working-directory: examples/local
        run: sudo podman exec -i circuit-github-runner bash < check.sh
      # Restarting the container boots systemd again, so this checks the unit
      # is still enabled, still skipped while unregistered, and the plan still
      # has nothing to do.
      - name: Restart the host, then check the runner and the plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-github-runner
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-github-runner systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec -i circuit-github-runner bash < check.sh
          conn3x plan -detailed-exitcode
      # GitHub rejects a made-up token, so the apply fails at config.sh, after
      # the token file is written. The token has to be on the host and
      # nowhere in state, and register = false has to take it off again.
      - name: Register with a token GitHub rejects, then check the token stayed out of state
        working-directory: examples/local
        run: |
          token=CONN3XCITOKEN$(openssl rand -hex 12 | tr a-f A-F)
          if TF_VAR_registration_token=$token conn3x apply -auto-approve -var register=true; then
            echo "Registering with a made-up token should have failed." >&2
            exit 1
          fi
          [ "$(sudo podman exec circuit-github-runner cat /etc/github-runner/token)" = "$token" ]
          if grep -q "$token" terraform.tfstate; then
            echo "The registration token is in terraform.tfstate." >&2
            exit 1
          fi
          conn3x apply -auto-approve
          sudo podman exec circuit-github-runner test ! -e /etc/github-runner/token
          conn3x plan -detailed-exitcode
      # A fresh host gets the previous release, then the circuit's own pin is
      # applied over it, the way someone raises runner_version with
      # auto_update = false.
      - name: Upgrade from runner 2.338.0 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          ./down.sh
          ./up.sh
          conn3x init
          conn3x apply -auto-approve -var runner_version=2.338.0 \
            -var 'checksums={x86_64="af4b794c1bc41d73d40535e3fe092a39f9679cd8d965954c2aca25a05ca41d32",aarch64="628b4a7258487b80c1d3c221095a7ded349f5ae0175fd3dfab708d07428f041b"}'
          [ "$(sudo podman exec circuit-github-runner runuser -u github-runner -- /opt/actions-runner/build/bin/Runner.Listener --version)" = 2.338.0 ]
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check the upgraded runner
        working-directory: examples/local
        run: sudo podman exec -i circuit-github-runner bash < check.sh
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
